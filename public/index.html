<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokePanion — VGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#0F1522; --panel:#18202F; --panel2:#1E2839; --line:#263349;
  --ink:#E8EDF7; --muted:#8A9CBB; --gold:#F0C24B; --gold-dim:#8A742F;
  --ok:#5CC97A; --warn:#E5766B;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#324565 var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--ink)}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0F1522 70%,rgba(15,21,34,.92));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:26px;height:62px}
.logo{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.logo b{color:var(--gold)}
.reg-chip{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:2px 8px;white-space:nowrap}
nav{display:flex;gap:4px;margin-left:auto}
.tab-btn{background:none;border:none;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-bottom:2px solid transparent;height:62px}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.wrap.wide{max-width:1760px}
.page-head{margin-bottom:22px}
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.02em}
.sub{color:var(--muted);max-width:640px;margin-top:6px}

/* ---------- News ---------- */
.news-filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 20px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 13px}
.chip:hover{color:var(--ink);border-color:#39507a}
.chip.on{background:var(--gold);border-color:var(--gold);color:#151002}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.news-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px}
.news-meta{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.news-cat{color:var(--gold)}
.news-date{color:var(--muted)}
.news-title{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.35}
.news-body{color:var(--muted);font-size:14px;flex:1}
.news-note{margin-top:26px;border:1px dashed var(--line);border-radius:8px;padding:14px 16px;color:var(--muted);font-size:13px}

/* ---------- Dex ---------- */
.mode-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.mode-btn{background:var(--panel);border:none;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.07em;padding:10px 20px;text-transform:uppercase}
.mode-btn + .mode-btn{border-left:1px solid var(--line)}
.mode-btn.on{background:var(--gold);color:#151002}
.mode-btn:not(.on):hover{color:var(--ink)}
.dex-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13.5px;width:220px}
.search::placeholder{color:#5F7195}
select.ctl{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px}
.tchip{background:transparent;border:1px solid;border-radius:5px;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 8px}
.tchip.on{color:#fff!important}
.shown-count{margin-left:auto;font-family:var(--disp);font-size:11.5px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.dex{width:100%;border-collapse:collapse;min-width:860px;background:var(--panel)}
table.dex th{position:sticky;top:0;background:var(--panel2);font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:11px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);z-index:2}
table.dex th.sortable{cursor:pointer;user-select:none}
table.dex th.sortable:hover{color:var(--ink)}
table.dex th.sorted{color:var(--gold)}
table.dex td{padding:7px 10px;border-bottom:1px solid #1C2637;font-size:13px;vertical-align:middle}
table.dex tbody tr{cursor:pointer}
table.dex tbody tr:hover td{background:#1F2A3F}
.cell-mon{display:flex;align-items:center;gap:10px;min-width:200px}
.row-sprite{width:40px;height:40px;image-rendering:pixelated;flex-shrink:0}
.row-dexno{font-family:var(--disp);font-size:10px;color:#5F7195;letter-spacing:.05em}
.mon-stack .row-name{font-family:var(--disp);font-weight:600;font-size:13.5px;line-height:1.2;color:var(--ink)}
.mini-badges{display:flex;gap:4px;margin-top:3px}
.tbm{border-radius:3px;font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.07em;padding:1.5px 5px;color:#fff}
.cell-abil{font-size:12px;color:var(--muted);line-height:1.45;min-width:150px}
.sv{font-family:var(--disp);font-weight:700;font-size:14.5px}
.sv.lo{color:#E5766B}.sv.mid{color:#E8C558}.sv.hi{color:#6BCB77}.sv.top{color:#5AA7F0}.sv.bst{color:var(--gold)}
.sv.plain{color:#FFF}
.type-badges{display:flex;gap:5px;flex-wrap:wrap}
.sq-card .type-badges{flex-wrap:nowrap;gap:4px;padding-right:6px}
.sq-card .tb{white-space:nowrap;flex:none;font-size:9px;letter-spacing:.04em;padding:2px 6px}
.tb{border-radius:3px;font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;color:#fff}
.loadmore{display:block;margin:22px auto 0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.08em;padding:10px 26px}
.loadmore:hover{border-color:var(--gold-dim)}
.eff-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:6px}
.eff-head{border-radius:4px;font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.05em;color:#fff;text-align:center;padding:4px 0}
.eff-cell{background:var(--bg);border:1px solid #1F2A3E;border-radius:4px;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--muted)}
.eff-cell.up{background:#3F8A34;border-color:#3F8A34;color:#fff}
.eff-cell.down{background:#8A2F2A;border-color:#8A2F2A;color:#fff}
.eff-cell.imm{background:#0A0E16;border-color:#0A0E16;color:#B9C4D8}
.abil-toggle{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.abil-toggle .chip.on{background:var(--gold);border-color:var(--gold);color:#151002}
.moves-search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:12.5px;margin-bottom:8px}
.moves-scroll{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
table.moves{width:100%;border-collapse:collapse;background:var(--panel)}
table.moves th{position:sticky;top:0;background:var(--panel2);font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
table.moves th.sortable{cursor:pointer;user-select:none}
table.moves th.sortable:hover{color:var(--ink)}
table.moves th.sorted{color:var(--gold)}
table.moves td{padding:6px 8px;border-bottom:1px solid #1C2637}
.mv-name{font-family:var(--disp);font-weight:600;font-size:12.5px}
.tb-pill{border-radius:9px;font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 10px;color:#fff;display:inline-block}
.mv-num{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--muted)}
.tooltip{position:fixed;z-index:200;max-width:270px;background:#0B111D;border:1px solid #33456A;border-radius:7px;padding:9px 11px;font-family:var(--body);font-size:12px;font-weight:400;line-height:1.45;color:#E8EDF7;letter-spacing:0;text-transform:none;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.tip-target{cursor:help}
.form-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fchip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:5px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}
.fchip:hover{color:var(--ink);border-color:#39507a}
.fchip.on{background:var(--gold);border-color:var(--gold);color:#151002}
.mega-svg{display:inline-block;flex-shrink:0}
.sentinel{height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

/* detail overlay */
.overlay{position:fixed;inset:0;background:rgba(8,12,20,.7);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;padding:26px}
.detail-wide{max-width:1080px}
.detail-cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.85fr);gap:0 28px;align-items:start}
.dd-right{border-left:1px solid var(--line);padding-left:26px;min-width:0;position:sticky;top:0}
.dd-sec{margin-bottom:20px}
.dd-h{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.dd-hn{letter-spacing:.04em;text-transform:none;color:var(--muted);font-family:var(--body);font-size:10.5px;font-weight:400}
.dd-note{font-size:12px;color:var(--muted);line-height:1.55}
.usage-line{font-family:var(--disp);font-size:12px;color:var(--gold);margin-top:3px;font-weight:700}
.usage-meta{color:var(--muted);font-family:var(--body);font-weight:400;font-size:10.5px}
.cell-usage{width:52px}
.usage-chip{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--gold)}
.usage-none{color:var(--muted);opacity:.45}
.ladder-stat{display:flex;align-items:baseline;gap:10px}
.ladder-rank{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--gold)}
.ladder-pct{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
.ladder-lbl{font-size:11px;color:var(--muted)}
.ld-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 7px;border-radius:5px;overflow:hidden;margin-bottom:2px}
.ld-fill{position:absolute;left:0;top:0;bottom:0;background:#1C2C45;border-radius:5px;z-index:0}
[data-theme="light"] .ld-fill{background:#DCE6F5}
.ld-name{position:relative;z-index:1;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-pct{position:relative;z-index:1;font-family:var(--disp);font-size:10.5px;font-weight:700;color:var(--gold);flex:none}
.ld-click{cursor:pointer}
.ld-click:hover .ld-fill{background:#24375A}
.cbd-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cbd-fmts{display:flex;gap:4px}
.cbd-fmt{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.cbd-fmt.on{color:var(--gold);border-color:var(--gold-dim)}
.cbd-note{font-size:11.5px;color:var(--muted);padding:4px 0 6px;line-height:1.5}
.cbd-mates{margin-top:8px}
.cbd-mate{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 8px;margin:0 5px 5px 0;cursor:pointer}
.cbd-mate:hover{border-color:var(--gold-dim);color:var(--gold)}
.cbd-mate.off{cursor:default;color:var(--muted)}
.cbd-credit{display:block;margin-top:6px;font-size:10.5px;color:var(--muted);text-decoration:none}
.cbd-credit:hover{color:var(--gold)}
[data-theme="light"] .ld-click:hover .ld-fill{background:#CBD9EE}
.tm-row{display:flex;align-items:center;gap:9px;padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.tm-row:hover{background:var(--panel2)}
.tm-row img{width:34px;height:34px;image-rendering:pixelated;flex:none}
.tm-rank{font-family:var(--disp);font-weight:700;color:var(--gold);font-size:12.5px;width:24px;flex:none}
.tm-name{font-weight:600;font-size:13px;color:var(--ink);flex:1;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.tm-pct{font-size:11px;color:var(--muted);flex:none}
.tf-row{padding:8px 4px;border-bottom:1px solid var(--line)}
.tf-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.tf-tag{font-size:10.5px;color:var(--muted)}
.tf-sprites{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.tf-sprites img{width:30px;height:30px;image-rendering:pixelated}
@media(max-width:980px){.detail-cols{display:block}.dd-right{border-left:none;padding-left:0;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;position:static}}
.detail-head{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.detail-art{width:120px;height:120px;flex-shrink:0}
.detail h2{font-family:var(--disp);font-size:22px}
.detail-flags{font-family:var(--disp);font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-top:4px}
.stat-row{display:grid;grid-template-columns:52px 34px 1fr;gap:10px;align-items:center;margin-bottom:7px}
.stat-name{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat-val{font-family:var(--disp);font-weight:600;font-size:13px;text-align:right}
.stat-bar-track{background:var(--panel2);border-radius:3px;height:8px;overflow:hidden}
.stat-bar{height:100%;border-radius:3px}
.detail-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.detail-label{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.abil{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 10px;margin:0 6px 6px 0;font-size:13px}
.abil.hidden-a{border-color:var(--gold-dim);color:var(--gold)}
.close-x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:32px;height:32px;font-size:15px;align-self:flex-start}
.hdr-icons{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-self:flex-start}
.hdr-icons .close-x{margin-left:0}
.close-x.sq-ico{display:flex;align-items:center;justify-content:center;gap:2px}
.close-x.gold,.icon-btn.gold{background:var(--gold);border-color:var(--gold);color:#151002}
.mega-xy{font-family:var(--disp);font-size:9px;font-weight:800}
.close-x:hover{color:var(--ink);border-color:#39507a}

/* ---------- VGC ---------- */
.vgc-cols{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:0 18px}
.vgc-cols > section{display:grid;grid-template-rows:subgrid;grid-row:span 2;align-content:start}
@supports not (grid-template-rows: subgrid){.vgc-cols > section{display:block}}
@media(max-width:1280px){.vgc-cols{grid-template-columns:1fr}}
@media(min-width:1081px){
  .wrap.wide{padding-top:16px}
  .wrap.wide .page-head{margin-bottom:10px}
  .wrap.wide .page-head .sub{font-size:12.5px;margin-top:2px}
  .wrap.wide h1{font-size:20px}
  .squad-grid{grid-template-columns:1fr 1fr;gap:10px}
  .sq-card{padding:10px 12px;border-radius:9px}
.sq-main{display:grid;grid-template-columns:112px minmax(0,0.92fr) minmax(0,1fr);gap:10px 16px;align-items:start;padding-right:42px}
.sq-artcell{display:flex;align-items:flex-start;justify-content:center}
.sq-chipstack{display:flex;flex-direction:column;gap:4px;margin-top:7px;align-items:flex-start}
.sq-chipstack>span{display:flex;max-width:100%;line-height:normal}
.sq-chipstack .sq-chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-chip.mutedc{color:var(--muted);border-style:dashed}
.sq-moves{display:flex;flex-direction:column;gap:0;align-items:stretch;min-width:0}
.mvl-row{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;padding:4px 4px;border-bottom:1px solid #1F2A3E;font-size:12.5px;color:var(--ink)}
.mvl-row:last-child{border-bottom:none}
.mvl-click{cursor:pointer}
.mvl-click:hover .mv-txt{color:var(--gold)}
.mvl-dia{width:9px;height:9px;transform:rotate(45deg);border-radius:2.5px;flex-shrink:0;box-shadow:0 0 5px rgba(255,255,255,.12)}
.mvl-empty{background:none;cursor:pointer;color:#3C4C6E;text-align:left;border:none;border-bottom:1px solid #1F2A3E}
.mvl-empty:hover{color:var(--gold);background:rgba(240,194,75,.05)}
.mvl-empty:last-child{border-bottom:none}
.mvl-o{width:9px;height:9px;border:1.5px solid #33405C;border-radius:50%;flex-shrink:0}
.mvl-empty:hover .mvl-o{border-color:var(--gold)}
.mvl-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--ink);font-size:12px;padding:4px 8px}
.ac-panel.mv-panel{min-width:250px;right:auto;max-width:320px}
.mvl-row .f-input{padding:2px 8px;height:20px;font-size:12px;line-height:16px}
.sq-card.clickable:focus-visible{outline:2px solid var(--gold-dim);outline-offset:2px}
.ns-wrap.compact .ns-trigger{padding:2px 7px;font-size:11.5px;gap:6px;height:24px;border-radius:5px}
.ns-wrap.compact .ns-caret{display:none}
.ns-wrap.compact .ns-mods{font-size:10px}
.ns-wrap.compact .ns-panel{min-width:230px;right:auto}
.sq-card.clickable{cursor:pointer;transition:border-color .15s}
.sq-card.clickable:hover{border-color:#3B4E75}
.mvac-opt{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;border-radius:5px;padding:6px 9px;color:var(--ink);font-size:12.5px;text-align:left;cursor:pointer}
.mvac-opt.hi{background:#1A2536}
.mvac-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvac-pow{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--muted);min-width:28px;text-align:right}
.numstep{display:inline-flex;align-items:stretch;gap:3px}
.numstep input::-webkit-outer-spin-button,.numstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numstep input[type=number]{-moz-appearance:textfield;appearance:textfield}
.numstep-btns{display:flex;flex-direction:column;gap:2px}

function typeMults(types, mod){
  const out = {};
  for(const atk of TYPES){
    let m = 1;
    for(const def of types) m *= (CHART[atk][def] !== undefined) ? CHART[atk][def] : 1;
    if(mod){
      if(mod.types && mod.types[atk] !== undefined) m *= mod.types[atk];
      if(mod.special === 'reduceSE' && m > 1) m *= 0.75;
      if(mod.special === 'wonderGuard' && m < 2) m = 0;
    }
    out[atk] = m;
  }

}

/* ============ pokepaste parse / export ============ */
const STAT_ALIAS = {hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'};
function parsePaste(text){
  const blocks = text.replace(/\r/g,'').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const team = [];
  for(const block of blocks){
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if(!lines.length) continue;
    const mon = {species:'',nickname:'',gender:'',item:'',ability:'',level:'',shiny:false,
                 teraType:'',evs:{},ivs:{},nature:'',moves:[]};
    // header line
    let head = lines[0];
    const itemSplit = head.split(' @ ');
    if(itemSplit.length > 1){ mon.item = itemSplit.slice(1).join(' @ ').trim(); head = itemSplit[0].trim(); }
    let m = head.match(/^(.*)\(([MF])\)\s*$/);
    if(m){ mon.gender = m[2]; head = m[1].trim(); }
    m = head.match(/^(.*)\((.+)\)\s*$/);
    if(m){ mon.nickname = m[1].trim(); mon.species = m[2].trim(); }
    else { mon.species = head.trim(); }
    // body lines
    for(const line of lines.slice(1)){
      if(line.startsWith('- ')){ mon.moves.push(line.slice(2).trim()); continue; }
      const kv = line.match(/^([A-Za-z ]+):\s*(.*)$/);
      if(kv){
        const key = kv[1].toLowerCase().trim(), val = kv[2].trim();
        if(key === 'ability') mon.ability = val;
        else if(key === 'level') mon.level = val;
        else if(key === 'shiny') mon.shiny = /^y/i.test(val);
        else if(key === 'tera type') mon.teraType = val;
        else if(key === 'evs' || key === 'ivs'){
          const tgt = key === 'evs' ? mon.evs : mon.ivs;
          val.split('/').forEach(part => {
            const pm = part.trim().match(/^(\d+)\s+(\w+)$/);
            if(pm){ const sk = STAT_ALIAS[pm[2].toLowerCase()]; if(sk) tgt[sk] = parseInt(pm[1]); }
          });
        }
        continue;
      }
      const nm = line.match(/^(\w[\w ]*?)\s+Nature$/i);
      if(nm) mon.nature = nm[1].trim();
    }
    team.push(mon);
  }
  return team;
}
function exportPaste(team){
  return team.filter(Boolean).map(mon => {
    const out = [];
    let head = mon.nickname ? `${mon.nickname} (${mon.species})` : mon.species;
    if(mon.gender) head += ` (${mon.gender})`;
    if(mon.item) head += ` @ ${mon.item}`;
    out.push(head);
    if(mon.ability) out.push(`Ability: ${mon.ability}`);
    if(mon.level) out.push(`Level: ${mon.level}`);
    if(mon.shiny) out.push(`Shiny: Yes`);
    if(mon.teraType) out.push(`Tera Type: ${mon.teraType}`);
    const evs = Object.entries(mon.evs || {});
    if(evs.length) out.push(`EVs: ${evs.map(([k,v]) => `${v} ${k}`).join(' / ')}`);
    if(mon.nature) out.push(`${mon.nature} Nature`);
    const ivs = Object.entries(mon.ivs || {});
    if(ivs.length) out.push(`IVs: ${ivs.map(([k,v]) => `${v} ${k}`).join(' / ')}`);
    (mon.moves || []).filter(Boolean).forEach(mv => out.push(`- ${mv}`));
    return out.join('\n');
  }).join('\n\n');
}

/* Render the squad's six cards to a PNG team sheet — a faithful 2×3 canvas copy
   of the on-screen cards: art, name, types, chip stack, moves with type diamonds,
   and the full stat rows with nature arrows and tier-colored bars. */
const SHOT = {bg:'#0F1522', panel:'#18202F', panel2:'#1E2839', line:'#263349', ink:'#E8EDF7', muted:'#8A9CBB', gold:'#F0C24B', goldDim:'#9A7B2E', up:'#E5766B', down:'#5AA7F0'};
function shotRR(ctx, x, y, w, h, r){
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shotFit(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
const shotImg = url => new Promise(res => {
  const im = new window.Image();
  im.onload = () => res(im); im.onerror = () => res(null);
  im.src = url;
});
function shotChip(ctx, x, y, text, filled){
  ctx.font = '600 11.5px system-ui, sans-serif';
  const t = shotFit(ctx, text, 150), w = ctx.measureText(t).width + 16;
  ctx.fillStyle = SHOT.panel2; shotRR(ctx, x, y, w, 20, 5); ctx.fill();
  ctx.strokeStyle = SHOT.line; ctx.lineWidth = 1; shotRR(ctx, x, y, w, 20, 5); ctx.stroke();
  ctx.fillStyle = filled ? SHOT.ink : SHOT.muted;
  ctx.fillText(t, x + 8, y + 14);
}
async function makeSquadShot(squad, teamName, statMode){
  const mons = squad.filter(Boolean).slice(0, 6);
  if(!mons.length) return false;
  const arts = await Promise.all(mons.map(async m => {
    const d = findMon(m.species);
    if(!d) return null;
    return (await shotImg(m.shiny ? ART_SHINY(d.id) : ART(d.id))) || (await shotImg(SPRITE(d.id)));
  }));
  const CW = 452, CH = 306, GAP = 14, M = 14;
  const cols = Math.min(2, mons.length), rows = Math.ceil(mons.length / 2);
  const W = M * 2 + CW * cols + GAP * (cols - 1);
  const H = M * 2 + CH * rows + GAP * (rows - 1);
  const canvas = document.createElement('canvas');
  canvas.width = W * 2; canvas.height = H * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = SHOT.bg; ctx.fillRect(0, 0, W, H);
  mons.forEach((mon, idx) => {
    const view = findMon(mon.species);
    const cx = M + (idx % 2) * (CW + GAP), cy = M + Math.floor(idx / 2) * (CH + GAP);
    /* card shell — gold "mine" border like on-screen */
    ctx.fillStyle = SHOT.panel;
    shotRR(ctx, cx, cy, CW, CH, 12); ctx.fill();
    ctx.strokeStyle = SHOT.goldDim; ctx.lineWidth = 1.5;
    shotRR(ctx, cx, cy, CW, CH, 12); ctx.stroke();
    /* art */
    const art = arts[idx];
    if(art){
      ctx.save(); shotRR(ctx, cx + 14, cy + 14, 106, 106, 10); ctx.clip();
      ctx.drawImage(art, cx + 14, cy + 14, 106, 106); ctx.restore();
    } else {
      ctx.fillStyle = SHOT.panel2; shotRR(ctx, cx + 14, cy + 14, 106, 106, 10); ctx.fill();
    }
    const tx = cx + 134, movesX = cx + CW - 168;
    /* name + shiny */
    ctx.fillStyle = SHOT.ink;
    ctx.font = "700 16px 'Chakra Petch', system-ui, sans-serif";
    const nm0 = mon.nickname ? mon.nickname + ' (' + mon.species + ')' : mon.species;
    const nm = shotFit(ctx, nm0, movesX - tx - 8 - (mon.shiny ? 18 : 0));
    ctx.fillText(nm, tx, cy + 32);
    if(mon.shiny){
      const w0 = ctx.measureText(nm).width;
      ctx.fillStyle = SHOT.gold; ctx.font = '13px system-ui';
      ctx.fillText('✦', tx + w0 + 7, cy + 31);
    }
    /* type pills */
    let px = tx;
    (view ? view.types : []).forEach(t => {
      ctx.font = '700 9.5px system-ui, sans-serif';
      const label = t.toUpperCase(), w = ctx.measureText(label).width + 14;
      ctx.fillStyle = TYPE_COLORS[t]; shotRR(ctx, px, cy + 41, w, 17, 4); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.fillText(label, px + 7, cy + 53);
      px += w + 5;
    });
    /* chip stack: ability / item (stone lock like the card) / nature */
    const stone = view && MEGA_STONES[view.slug];
    shotChip(ctx, tx, cy + 66,  mon.ability || 'No Ability', !!mon.ability);
    shotChip(ctx, tx, cy + 90,  stone ? (mon.item || stone) : (mon.item || 'No Item'), !!(mon.item || stone));
    shotChip(ctx, tx, cy + 114, mon.nature || 'No Nature', !!mon.nature);
    /* moves with type diamonds */
    for(let mi = 0; mi < 4; mi++){
      const mv = (mon.moves || [])[mi];
      const my = cy + 34 + mi * 28;
      const md = mv ? MOVE_BY_NAME[mv] : null;
      ctx.save();
      ctx.translate(movesX + 7, my - 4); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = mv ? (md ? TYPE_COLORS[md.type] : SHOT.muted) : SHOT.panel2;
      ctx.fillRect(-4.5, -4.5, 9, 9);
      ctx.restore();
      ctx.fillStyle = mv ? SHOT.ink : SHOT.muted;
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.fillText(mv ? shotFit(ctx, mv, 148) : '—', movesX + 20, my);
    }
    /* stat rows — same math as the on-screen card */
    const nmod = (mon.nature && NATURE_MODS[mon.nature]) || {};
    const vals = view ? (statMode === 'actual' ? finalStats(view, mon) : view.stats) : [0,0,0,0,0,0];
    const scale = statMode === 'actual' ? 2.6 : 2;
    const sy0 = cy + 152, step = 24;
    const trackX = cx + 128, trackW = CW - 128 - 18;
    for(let i = 0; i < 6; i++){
      const key = STAT_KEYS[i], v = vals[i], ry = sy0 + i * step;
      if(nmod.up === key || nmod.down === key){
        ctx.fillStyle = nmod.up === key ? SHOT.up : SHOT.down;
        ctx.font = '9px system-ui';
        ctx.fillText(nmod.up === key ? '▲' : '▼', cx + 16, ry);
      }
      ctx.fillStyle = SHOT.muted;
      ctx.font = "700 9.5px 'Chakra Petch', system-ui, sans-serif";
      ctx.fillText(key.toUpperCase(), cx + 30, ry);
      ctx.fillStyle = SHOT.ink;
      ctx.font = '700 12.5px system-ui, sans-serif';
      const vs = String(v);
      ctx.fillText(vs, cx + 118 - ctx.measureText(vs).width, ry);
      ctx.fillStyle = SHOT.panel2;
      shotRR(ctx, trackX, ry - 8, trackW, 5, 2.5); ctx.fill();
      const frac = Math.min(100, v / scale) / 100;
      if(frac > 0){
        ctx.fillStyle = TIER_COLORS[statTier(statMode === 'actual' ? Math.round(v / 1.35) : v)];
        shotRR(ctx, trackX, ry - 8, Math.max(4, trackW * frac), 5, 2.5); ctx.fill();
      }
    }
  });
  /* hand the finished image back for previewing */
  return await new Promise(res => canvas.toBlob(res, 'image/png'));
}

const SAVE_HEAD_SQUAD = '=== Squad ===';
const SAVE_HEAD_REF = '=== Reference ===';
/* Saved-team library — persists via localStorage when available (file:// / hosted),
   silently falls back to in-memory for sandboxed previews. Teams stored as
   {name, paste} using plain PokéPaste text. */
const TEAM_STORE_KEY = 'cc-saved-teams-v1';
const teamStore = (() => {
  let mem = [];
  const read = () => {
    try{ const raw = window.localStorage.getItem(TEAM_STORE_KEY); return raw ? JSON.parse(raw) : mem; }
    catch(_){ return mem; }
  };
  const write = list => {
    mem = list;
    try{ window.localStorage.setItem(TEAM_STORE_KEY, JSON.stringify(list)); }catch(_){}
  };
  return {read, write};
})();

function serializeSave(squad, refs){
  return SAVE_HEAD_SQUAD + '\n\n' + exportPaste(squad) + '\n\n' + SAVE_HEAD_REF + '\n\n' + exportPaste(refs) + '\n';
}
function parseSave(raw){
  const text = String(raw || '').replace(/\r/g, '');
  const sq = text.indexOf(SAVE_HEAD_SQUAD), rf = text.indexOf(SAVE_HEAD_REF);
  if(sq === -1 && rf === -1) return {squad: parsePaste(text), refs: []};
  let squadTxt = '', refTxt = '';
  if(sq !== -1) squadTxt = text.slice(sq + SAVE_HEAD_SQUAD.length, rf > sq ? rf : undefined);
  if(rf !== -1) refTxt = text.slice(rf + SAVE_HEAD_REF.length, sq > rf ? sq : undefined);
  return {squad: parsePaste(squadTxt), refs: parsePaste(refTxt)};
}

function ArtImg({id, dex, shiny, className}){
  const base = DEFAULT_ID[dex] !== id ? DEFAULT_ID[dex] : null;
  const chain = [
    ...(shiny ? [ART_S(id), SPRITE_S(id)] : []),
    ART(id), SPRITE(id),
    ...(base ? [ART(base), SPRITE(base)] : [])
  ];
  const [i, setI] = useState(0);
  useEffect(() => setI(0), [id, shiny]);
  if(i >= chain.length) return <div className={className} style={{visibility:'hidden'}}/>;
  return <img className={className} src={chain[i]} alt="" onError={() => setI(x => x + 1)}/>;
}

function Tip({text, children, className, ...rest}){
  const [pos, setPos] = useState(null);
  if(!text) return <span className={className} {...rest}>{children}</span>;
  const move = e => setPos({
    x: Math.min(e.clientX + 14, window.innerWidth - 290),
    y: Math.min(e.clientY + 18, window.innerHeight - 90)
  });
  return (
    <span className={(className || '') + ' tip-target'} {...rest}
      onMouseEnter={move} onMouseMove={move} onMouseLeave={() => setPos(null)}>
      {children}

function MovesPanel({mon}){

      if(sk === 'cat') return sd * a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name);

                <td className="mv-num">{m.cat}</td>

/* ---- competitive intel: teammates + featured teams from every team the app knows ----
   Sources: bundled tournament snapshot, creator teams, your trending teams, your saved
   library, and the opponent log. When the site goes online this swaps to live
   Showdown-ladder teammate stats + tournament team lists. */
function knownTeams(){
  const out = [];
  const add = (name, tag, paste, log) => {
    try{
      const sp = parsePaste(paste).map(m => m.species).filter(Boolean);
      if(sp.length) out.push({name, tag, species: sp, log: !!log});
    }catch(_){}
  };
  TOP_TEAMS.forEach(t => add(t.name, t.src, t.paste));
  lsArr('cc-user-teams-v1').forEach(t => add(t.name, 'Your trending team', t.paste));
  lsArr('cc-saved-teams-v1').forEach(t => add(t.name, 'Saved team', t.paste));
  lsArr('cc-opponent-log-v1').forEach((e, i) => {
    if(e.excluded) return;
    const sp = (e.mons || []).map(m => m.species).filter(Boolean);
    if(sp.length) out.push({name: 'Logged opponent #' + (i + 1), tag: 'Opponent log', species: sp, log: true});
  });
  return out;
}
function teammateIntel(name){
  const canon = sp => { const d = findMon(sp); return d ? d.name : sp; };
  const me = canon(name);
  const teams = knownTeams();
  const withMe = teams.filter(t => t.species.some(sp => canon(sp) === me));
  const tally = {};
  withMe.forEach(t => {
    [...new Set(t.species.map(canon))].forEach(sp => { if(sp !== me) tally[sp] = (tally[sp] || 0) + 1; });
  });
  const mates = Object.entries(tally)
    .map(([sp, n]) => ({species: sp, n, pct: Math.round(n / withMe.length * 100)}))
    .sort((a, b) => b.n - a.n || a.species.localeCompare(b.species))
    .slice(0, 8);
  return {withMe, mates};
}

/* ---- Live in-game ranked data · championsbattledata.com ----
   Fan-made explorer of the game's own ranked ladder (CORS-enabled API, credit required).
   Fetched on demand per Pokémon + format, cached for 12h, silent when offline. */
const CBD_URL = 'https://championsbattledata.com';
const CBD_CACHE_KEY = 'cc-cbd-v1';
const CBD_TTL = 12 * 60 * 60 * 1000;
function cbdId(mon){
  const base = mon.name.toLowerCase().replace(/[^a-z0-9]/g, '');
  return {floette: 'floetteeternal'}[base] || base;
}
function cbdDistill(rows){
  const by = cat => rows.filter(r => r.category === cat);
  const pct = r => (r.percentage_value == null ? null : r.percentage_value);
  return {
    m: by('move').slice(0, 6).map(r => [r.name, pct(r)]),
    i: by('held_item').slice(0, 6).map(r => [r.name, pct(r)]),
    a: by('ability').slice(0, 3).map(r => [r.name, pct(r)]),
    n: by('stat_alignment').slice(0, 3).map(r => [r.name + (r.stat_up ? ' (+' + r.stat_up + ' −' + r.stat_down + ')' : ''), pct(r)]),
    s: by('stat_points').slice(0, 4).map(r => [[r.hp_points, r.attack_points, r.defense_points, r.sp_atk_points, r.sp_def_points, r.speed_points].map(v => v === '' ? 0 : v).join('/'), pct(r)]),
    t: by('teammate').slice(0, 6).map(r => r.name)
  };
}
async function cbdFetch(id, format){
  const res = await fetch(CBD_URL + '/api/battle/' + format + '/' + id);
  if(!res.ok) throw new Error('http ' + res.status);
  const json = await res.json();
  const rows = json.rows && json.rows.length ? json.rows
    : (json.daily && json.daily.length ? json.daily[0].rows : []);
  if(!rows.length) throw new Error('empty');
  return {season: json.season || '', data: cbdDistill(rows)};
}
function CbdSection({mon, onJump}){
  const [fmt, setFmt] = useState('Doubles');
  const [state, setState] = useState({status: 'loading'});
  useEffect(() => {
    let live = true;
    const key = fmt + ':' + mon.slug;
    let cache = {};
    try{ cache = JSON.parse(localStorage.getItem(CBD_CACHE_KEY) || '{}'); }catch(_){}
    const hit = cache[key];
    if(hit && Date.now() - hit.at < CBD_TTL){
      setState({status: 'ok', season: hit.season, data: hit.data});
      return;
    }
    setState({status: 'loading'});
    (async () => {
      try{
        let out;
        try{ out = await cbdFetch(cbdId(mon), fmt); }
        catch(e){
          const baseSlug = mon.slug.replace(/-mega(-[a-z])?$/, '');
          if(baseSlug === mon.slug) throw e;
          const baseMon = POKEDEX.find(x => x.slug === baseSlug);
          if(!baseMon) throw e;
          out = await cbdFetch(cbdId(baseMon), fmt);
          out.viaBase = baseMon.name;
        }
        if(!live) return;
        try{
          cache[key] = {at: Date.now(), season: out.season, data: out.data, viaBase: out.viaBase};
          localStorage.setItem(CBD_CACHE_KEY, JSON.stringify(cache));
        }catch(_){}
        setState({status: 'ok', season: out.season, data: out.data, viaBase: out.viaBase});
      }catch(_){
        if(live) setState({status: 'err'});
      }
    })();
    return () => { live = false; };
  }, [mon.slug, fmt]);
  const d = state.data;
  return (
    <div className="dd-sec cbd">
      <div className="dd-h cbd-head">
        <span>In-game ranked ladder{state.season ? ' · Season ' + state.season : ''}</span>
        <span className="cbd-fmts">
          {['Doubles', 'Singles'].map(f => (
            <button key={f} type="button" className={'cbd-fmt' + (fmt === f ? ' on' : '')} onClick={() => setFmt(f)}>{f}</button>
          ))}
        </span>
      </div>
      {state.status === 'loading' && <div className="cbd-note">Loading live battle data…</div>}
      {state.status === 'err' && <div className="cbd-note">Live data unavailable — this section needs an internet connection (or this Pokémon has no ranked data yet).</div>}
      {state.status === 'ok' && d && (
        <React.Fragment>
          {state.viaBase && <div className="cbd-note">Shown under {state.viaBase} — the in-game ladder counts Mega usage on the base form (see its Mega Stone below).</div>}
          <LadderSection title={'Top moves · in-game ' + fmt} rows={d.m}/>
          <LadderSection title={'Top items · in-game ' + fmt} rows={d.i}/>
          {(d.a.length > 1) && <LadderSection title="Abilities" rows={d.a}/>}
          <LadderSection title="Stat alignments" rows={d.n}/>
          <LadderSection title="Stat point spreads (HP/Atk/Def/SpA/SpD/Spe)" rows={d.s}/>
          {d.t.length > 0 && (
            <div className="cbd-mates">
              <div className="dd-hn" style={{marginBottom: 4}}>Common teammates · in-game {fmt}</div>
              {d.t.map(nm => {
                const dm = findMon(nm) || findMon(nm.replace(/ (Male|Female)$/, ''));
                return dm
                  ? <button key={nm} type="button" className="cbd-mate" onClick={() => onJump(dm)}>{dm.name}</button>
                  : <span key={nm} className="cbd-mate off">{nm}</span>;
              })}
            </div>
          )}
        </React.Fragment>
      )}
      <a className="cbd-credit" href="https://championsbattledata.com/" target="_blank" rel="noopener noreferrer">Data: Pokemon Champions Battle Data — championsbattledata.com</a>
    </div>
  );
}

function MonDetail({mon, onClose, onPrev, onNext, onJump}){
  const allAbilities = [...mon.abilities, ...(mon.hiddenAbility ? [mon.hiddenAbility] : [])];
  const modAbilities = allAbilities.filter(a => ABILITY_MODS[a]);
  const defaultMod = (allAbilities.length === 1 && modAbilities.length === 1) ? modAbilities[0] : null;
  const [abilMod, setAbilMod] = useState(defaultMod);
  useEffect(() => setAbilMod(defaultMod), [mon.id]);
  useEffect(() => {
    const h = e => {
      if(e.key === 'Escape') onClose();
      else if(e.key === 'ArrowLeft' && onPrev) onPrev();
      else if(e.key === 'ArrowRight' && onNext) onNext();
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onPrev, onNext]);
  const mults = typeMults(mon.types, abilMod ? ABILITY_MODS[abilMod] : null);
  const typeRows = [TYPES.slice(0,9), TYPES.slice(9)];
  const [varIdx, setVarIdx] = useState(0);
  const [shiny, setShiny] = useState(false);
  useEffect(() => { setVarIdx(0); setShiny(false); }, [mon.id]);
  const artId = mon.variants ? mon.variants[varIdx].id : mon.id;
  const siblings = POKEDEX.filter(x => x.dex === mon.dex && x.id !== mon.id);
  const stripBase = n => {
    const cut = n.replace(mon.name, '').replace(/^-/, '');
    return cut || n;
  };
  const formLabel = s => {
    const base = POKEDEX.find(x => x.dex === s.dex && x.default);
    const baseName = base ? base.name : '';
    if(s.name === baseName) return baseName;
    const suffix = baseName && s.name.startsWith(baseName) ? s.name.slice(baseName.length).replace(/^-/, '') : s.name;
    return suffix || s.name;
  };
  const isComp = !!(LEARN[mon.id] && LEARN[mon.id].length);
  return (
    <div className="overlay" onClick={e => { if(e.target === e.currentTarget) onClose(); }}>
      <div className={'detail' + (isComp ? ' detail-wide' : '')} role="dialog" aria-modal="true" aria-label={mon.name}>
        <div className={isComp ? 'detail-cols' : ''}>
        <div className="dd-left">
        <div className="detail-head">
          <img className="detail-art" key={(shiny ? 's' : 'n') + artId} src={shiny ? ART_SHINY(artId) : ART(artId)} alt=""
            onError={e => {
              if(shiny && !e.target.dataset.sf){ e.target.dataset.sf = '1'; e.target.src = ART(artId); return; }
              if(!e.target.dataset.fb){ e.target.dataset.fb = 'a'; e.target.src = SPRITE(artId); } else spriteFallback(e, mon);
            }}/>
          <div>
            <div className="row-dexno">#{String(mon.dex).padStart(4,'0')} · Gen {mon.gen}
              {REG.legal.has(mon.dex) && <span style={{color:'var(--gold)'}}> · {REG.id} legal</span>}</div>
            {ladderOf(mon) && <div className="usage-line">Ladder #{ladderOf(mon)[0]} · {ladderOf(mon)[1]}% usage
              <span className="usage-meta"> — {LADDER.fmt} · {LADDER.month} · {LADDER.cutoff}+</span></div>}
            <h2>{mon.name}</h2>
            <div className="type-badges" style={{marginTop:6}}>
              {mon.types.map(t => <span key={t} className="tb" style={{background:TYPE_COLORS[t]}}>{t}</span>)}
            </div>
            {mon.variants && mon.variants.length > 1 && (

                    onClick={() => setVarIdx(i)}>{v.name.startsWith(mon.name + '-') ? v.name.slice(mon.name.length + 1) : (v.name === mon.name ? 'Base' : v.name)}</button>
                ))}

            {(() => {
              const others = siblings.filter(s => !/-mega/.test(s.slug) && !(/-mega/.test(mon.slug) && s.default));
              return others.length > 0 && siblings.length <= 8 && (
                <div className="form-chips" aria-label="Other forms">

              <button className={'close-x sq-ico' + (shiny ? ' gold' : '')} onClick={() => setShiny(s => !s)} aria-label="Shiny"><ShinyIcon size={13}/></button>
            </Tip>
            {(() => {
              const base = POKEDEX.find(x => x.dex === mon.dex && x.default);
              const megas = POKEDEX.filter(x => x.dex === mon.dex && /-mega/.test(x.slug))
                .sort((a,b) => a.slug.localeCompare(b.slug));   // X before Y

              {modAbilities.map(a => (
                <Tip key={a} text={ABIL_DESC[a]}>
                  <button className={'chip' + (abilMod === a ? ' on' : '')}
                    onClick={() => setAbilMod(abilMod === a ? null : a)}>{a}</button>
                </Tip>
              ))}
            </div>
          )}
          {typeRows.map((row,ri) => (
            <div className="eff-grid" key={ri}>
              {row.map(t => <div key={t} className="eff-head" style={{background:TYPE_COLORS[t]}}>{TYPE_ABBR[t]}</div>)}
              {row.map(t => {
                const m = mults[t];
                const cls = m === 0 ? ' imm' : m > 1 ? ' up' : m < 1 ? ' down' : '';
                return <div key={t} className={'eff-cell' + cls}>{m === 1 ? '' : fmtMult(m)}</div>;
              })}
            </div>
          ))}
        </div>
        <div className="detail-section">
          <div className="detail-label">Learnable moves · Champions</div>
          <MovesPanel mon={mon}/>
        </div>
        <div className="detail-section">
          <div className="detail-label">Profile</div>
          <span style={{color:'var(--muted)',fontSize:13.5}}>
            {(mon.height/10).toFixed(1)} m · {(mon.weight/10).toFixed(1)} kg
          </span>
        </div>
        </div>
        {isComp && <div className="dd-right"><CompIntel mon={mon} onJump={onJump}/></div>}
        </div>
      </div>
    </div>
  );
}

const COLS = [
  {key:'dex', label:'#', sortable:true},
  {key:'name', label:'Pokémon', sortable:true},

  {key:'abil', label:'Abilities', sortable:false},
  {key:'hp', label:'HP', sortable:true, stat:0},
  {key:'atk', label:'Atk', sortable:true, stat:1},
  {key:'def', label:'Def', sortable:true, stat:2},
  {key:'spa', label:'SpA', sortable:true, stat:3},
  {key:'spd', label:'SpD', sortable:true, stat:4},
  {key:'spe', label:'Spe', sortable:true, stat:5},
  {key:'bst', label:'BST', sortable:true},
];

function DexPage(){
  const [mode, setMode] = useState(() => lsGet('cc-dexmode-v1', 'comp') === 'complete' ? 'complete' : 'comp');    // complete | comp
  useEffect(() => lsSet('cc-dexmode-v1', mode), [mode]);
  /* filters persist across page switches (cc-dexfilters-v1) */
  const df = lsGet('cc-dexfilters-v1', {}) || {};
  const [q, setQ] = useState(typeof df.q === 'string' ? df.q : '');
  const [abilQ, setAbilQ] = useState(typeof df.abilQ === 'string' ? df.abilQ : '');
  const [moveQ, setMoveQ] = useState(typeof df.moveQ === 'string' ? df.moveQ : '');
  const [moveQ2, setMoveQ2] = useState(typeof df.moveQ2 === 'string' ? df.moveQ2 : '');
  const [types, setTypes] = useState(Array.isArray(df.types) ? df.types : []);          // multi-select type filter
  const [gen, setGen] = useState(typeof df.gen === 'number' ? df.gen : 0);
  const [sortKey, setSortKey] = useState(typeof df.sortKey === 'string' ? df.sortKey : 'dex');
  const [sortDir, setSortDir] = useState(df.sortDir === -1 ? -1 : 1);
  const [forms, setForms] = useState(df.forms === false ? false : true);
  const [limit, setLimit] = useState(100);
  const [sel, setSel] = useState(null);
  const sentinelRef = React.useRef(null);
  useEffect(() => lsSet('cc-dexfilters-v1', {q, abilQ, moveQ, moveQ2, types, gen, sortKey, sortDir, forms}),
    [q, abilQ, moveQ, moveQ2, types, gen, sortKey, sortDir, forms]);

  const toggleType = t => setTypes(ts => ts.includes(t) ? ts.filter(x => x !== t) : [...ts, t]);
  const setSort = key => {
    if(sortKey === key){ setSortDir(-sortDir); return; }
    setSortKey(key);
    setSortDir(key === 'dex' || key === 'name' ? 1 : -1);
  };

  const filtered = useMemo(() => {
    let list = POKEDEX;
    if(mode === 'comp') list = list.filter(p => REG.legal.has(p.dex) && !COMP_EXCLUDE.test(p.slug));
    else if(!forms) list = list.filter(p => p.default);
    if(q){ const n = norm(q); list = list.filter(p => p.slug.includes(n) || norm(p.name).includes(n)); }
    [moveQ, moveQ2].forEach(mv => {
      if(!mv.trim()) return;
      const mq = mv.trim().toLowerCase();
      const hit = new Set();
      MOVES.forEach((m, i) => { if(m.name.toLowerCase().includes(mq)) hit.add(i); });
      list = list.filter(p => (LEARN[p.id] || []).some(i => hit.has(i)));
    });
    if(abilQ){ const a = abilQ.toLowerCase();
      list = list.filter(p => p.abilities.some(x => x.toLowerCase().includes(a)) ||
                              (p.hiddenAbility && p.hiddenAbility.toLowerCase().includes(a))); }
    if(types.length) list = list.filter(p => types.every(t => p.types.includes(t)));
    if(gen) list = list.filter(p => p.gen === gen);
    const col = COLS.find(c => c.key === sortKey);
    list = [...list].sort((a,b) => {
      if(sortKey === 'name') return sortDir * a.name.localeCompare(b.name);
      let va, vb;
      if(sortKey === 'dex'){ va = a.dex * 1000000 + a.id; vb = b.dex * 1000000 + b.id; }
      else if(sortKey === 'usage'){ va = ladderOf(a) ? -ladderOf(a)[0] : -99999; vb = ladderOf(b) ? -ladderOf(b)[0] : -99999; }
      else if(sortKey === 'bst'){ va = a.bst; vb = b.bst; }
      else { va = a.stats[col.stat]; vb = b.stats[col.stat]; }
      return sortDir * (va - vb) || a.id - b.id;
    });
    return list;
  }, [mode, q, abilQ, moveQ, moveQ2, types, gen, sortKey, sortDir, forms]);

  useEffect(() => { setLimit(100); setSel(null); }, [mode, q, abilQ, moveQ, moveQ2, types, gen, sortKey, sortDir, forms]);

  useEffect(() => {
    const el = sentinelRef.current;
    if(!el) return;
    const obs = new IntersectionObserver(entries => {
      if(entries[0].isIntersecting) setLimit(l => l + 100);
    }, {rootMargin: '800px'});
    obs.observe(el);
    return () => obs.disconnect();
  }, [filtered, limit]);

  return (
    <div>
      <div className="page-head">
        <h1>Competitive Pokédex</h1>
      </div>
      <div className="mode-toggle" role="group" aria-label="Dex mode">
        <button className={'mode-btn' + (mode === 'complete' ? ' on' : '')} onClick={() => setMode('complete')}>Complete Pokédex</button>
        <button className={'mode-btn' + (mode === 'comp' ? ' on' : '')} onClick={() => setMode('comp')}>Competitive · {REG.id}</button>
      </div>
      <div className="dex-toolbar">
        <input className="search" placeholder="Search Pokémon…" value={q} onChange={e => setQ(e.target.value)} aria-label="Search Pokémon"/>
        {TYPES.map(t => (
          <button key={t} className={'tchip' + (types.includes(t) ? ' on' : '')}
            style={types.includes(t) ? {background:TYPE_COLORS[t], borderColor:TYPE_COLORS[t]} : {color:TYPE_COLORS[t], borderColor:TYPE_COLORS[t] + '66'}}
            onClick={() => toggleType(t)} aria-pressed={types.includes(t)}>{TYPE_ABBR[t]}</button>
        ))}
      </div>
      <div className="dex-toolbar">
        <input className="search" style={{width:180}} placeholder="Filter by ability…" value={abilQ} onChange={e => setAbilQ(e.target.value)} aria-label="Filter by ability"/>
        <input className="search" style={{width:180}} placeholder="Filter by move…" value={moveQ} onChange={e => setMoveQ(e.target.value)} aria-label="Filter by move"/>
        <input className="search" style={{width:180}} placeholder="+ second move…" value={moveQ2} onChange={e => setMoveQ2(e.target.value)} aria-label="Filter by second move"/>
        <select className="ctl" value={gen} onChange={e => setGen(+e.target.value)} aria-label="Generation">
          <option value={0}>All gens</option>
          {[1,2,3,4,5,6,7,8,9].map(g => <option key={g} value={g}>Gen {g}</option>)}
        </select>
        {mode === 'complete' &&
          <button className={'chip' + (forms ? ' on' : '')} onClick={() => setForms(!forms)}>Forms</button>}
        <span className="shown-count">{filtered.length} shown</span>
      </div>
      <div className="table-wrap">
        <table className="dex">
          <thead>
            <tr>
              {COLS.map(c => (
                <th key={c.key}
                    className={(c.sortable ? 'sortable ' : '') + (sortKey === c.key ? 'sorted' : '')}
                    onClick={c.sortable ? () => setSort(c.key) : undefined}
                    aria-sort={sortKey === c.key ? (sortDir === 1 ? 'ascending' : 'descending') : undefined}>
                  {c.label}{sortKey === c.key ? (sortDir === 1 ? ' ▲' : ' ▼') : ''}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.slice(0, limit).map((p, i) => (
              <tr key={p.id} onClick={() => setSel(p)}>
                <td className="row-dexno">{String(p.dex).padStart(3,'0')}</td>
                <td className="cell-usage">{(() => { const u = ladderOf(p);
                  return u ? <Tip text={`#${u[0]} · ${u[1]}% usage — ${LADDER.fmt} ladder, ${LADDER.month} (${LADDER.cutoff}+)`}>
                    <span className="usage-chip">#{u[0]}</span></Tip> : <span className="usage-none">—</span>; })()}</td>
                <td>
                  <div className="cell-mon">
                    <img className="row-sprite" loading="lazy" src={SPRITE(p.id)} alt="" onError={e => spriteFallback(e, p)}/>
                    <div className="mon-stack">
                      <div className="row-name">{p.name}</div>
                      <div className="mini-badges">
                        {p.types.map(t => <span key={t} className="tbm" style={{background:TYPE_COLORS[t]}}>{TYPE_ABBR[t]}</span>)}
                      </div>
                    </div>
                  </div>
                </td>
                <td className="cell-abil">
                  {[...p.abilities, ...(p.hiddenAbility ? [p.hiddenAbility] : [])].map((a,ai,arr) => (
                    <React.Fragment key={a}>
                      <Tip text={ABIL_DESC[a]}>{a}</Tip>{ai < arr.length - 1 ? ' / ' : ''}
                    </React.Fragment>
                  ))}
                </td>
                {p.stats.map((v,i) => <td key={i}><span className={'sv ' + statTier(v)}>{v}</span></td>)}
                <td><span className="sv bst">{p.bst}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {filtered.length > limit &&
        <div className="sentinel" ref={sentinelRef}>Loading more…</div>}
      {sel && (() => {
        const idx = filtered.findIndex(p => p.id === sel.id);
        return <MonDetail mon={sel}
          onClose={() => setSel(null)}
          onJump={setSel}
          onPrev={idx > 0 ? () => setSel(filtered[idx - 1]) : null}
          onNext={idx !== -1 && idx < filtered.length - 1 ? () => setSel(filtered[idx + 1]) : null}/>;
      })()}
    </div>
  );
}

/* ---- Champions stat engine: fixed 31 IVs, Stat Points 0-32 per stat / 66 total, Lv 50 ---- */
const LV = 50, SP_TOTAL = 66, SP_CAP = 32;
function calcStat(base, sp, key, natureName){
  sp = sp || 0;
  if(key === 'HP') return Math.floor((2 * base + 31) * LV / 100) + LV + 10 + sp;
  const nm = NATURE_MODS[natureName] || {};
  const mod = nm.up === key ? 1.1 : nm.down === key ? 0.9 : 1;
  return Math.floor((Math.floor((2 * base + 31) * LV / 100) + 5 + sp) * mod);
}
const finalStats = (dex, mon) => dex.stats.map((b, i) => calcStat(b, (mon.evs || {})[STAT_KEYS[i]], STAT_KEYS[i], mon.nature));
/* normalize imported EV lines to SP (mainline 252-spreads scale down; Champions pastes pass through) */
function toSP(evs){
  const sp = {};
  const scale = Object.values(evs || {}).some(v => v > SP_CAP);
  for(const [k, v] of Object.entries(evs || {})){
    const s = Math.min(SP_CAP, scale ? Math.round(v / 252 * SP_CAP) : v);
    if(s > 0) sp[k] = s;
  }
  let total = Object.values(sp).reduce((a,b) => a + b, 0);
  const order = Object.keys(sp).sort((a,b) => sp[b] - sp[a]);
  for(const k of order){ if(total <= SP_TOTAL) break; const cut = Math.min(sp[k], total - SP_TOTAL); sp[k] -= cut; total -= cut; if(!sp[k]) delete sp[k]; }
  return sp;
}

  let v = calcStat(dex.stats[5], (mon.evs || {}).Spe, 'Spe', mon.nature);
  const st = stage || 0;
  if(st) v = Math.floor(v * (st > 0 ? (2 + st) / 2 : 2 / (2 - st)));
  if(scarf) v = Math.floor(v * 1.5);
  if(tw) v = Math.floor(v * 2);
  return v;
};

function NatureSelect({value, onChange, compact, placeholder, startOpen, onClose}){
  const [open, setOpen] = useState(!!startOpen);
  const [hi, setHi] = useState(0);
  const wrap = React.useRef(null);
  useEffect(() => {
    if(!open) return;
    const away = e => { if(wrap.current && !wrap.current.contains(e.target)){ setOpen(false); if(onClose) onClose(); } };
    document.addEventListener('mousedown', away);
    return () => document.removeEventListener('mousedown', away);
  }, [open]);
  useEffect(() => {
    if(open) setHi(Math.max(0, NATURE_FLAT.findIndex(n => n.name === value)));
  }, [open]);
  const choose = i => { onChange(NATURE_FLAT[i].name); setOpen(false); };
  const key = e => {
    if(!open){
      if(e.key === 'Enter' || e.key === 'ArrowDown' || e.key === ' '){ e.preventDefault(); setOpen(true); }
      return;
    }
    e.stopPropagation();
    if(e.key === 'ArrowDown'){ e.preventDefault(); setHi(h => Math.min(NATURE_FLAT.length - 1, h + 1)); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setHi(h => Math.max(0, h - 1)); }
    else if(e.key === 'Enter'){ e.preventDefault(); choose(hi); }
    else if(e.key === 'Escape'){ e.preventDefault(); setOpen(false); }
  };
  let flatIdx = -1;
  return (
    <div className={'ns-wrap' + (compact ? ' compact' : '')} ref={wrap}>
      <button type="button" className="ns-trigger" onClick={() => setOpen(o => !o)} onKeyDown={key}
        aria-haspopup="listbox" aria-expanded={open}>
        <span className="ns-dot" style={{background: value ? natureColor(value) : '#33405C'}}/>
        <span>{value || placeholder || 'Select nature'}</span>
        {value ? <NatureMods name={value} color={natureColor(value)}/> : <span className="ns-mods dn">—</span>}
        <span className="ns-caret">▼</span>
      </button>
      {open && (
        <div className="ns-panel" role="listbox">
          {NATURE_GROUPS.map(g => (
            <React.Fragment key={g.label}>
              <div className="ns-group" style={{color:g.color}}>
                {g.label}{g.key && <span style={{fontSize:8}}>▲</span>}
              </div>
              {g.list.map(n => {
                flatIdx++;
                const i = flatIdx;
                return (
                  <button type="button" key={n} role="option" aria-selected={value === n}
                    className={'ns-opt' + (hi === i ? ' hi' : '') + (value === n ? ' sel' : '')}
                    style={{borderLeftColor:g.color}}
                    onMouseEnter={() => setHi(i)} onClick={() => choose(i)}>
                    <span className="ns-name">{n}</span>
                    <NatureMods name={n} color={g.color}/>
                  </button>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      )}
    </div>
  );
}

  const commit = name => { committedRef.current = true; setOpen(false); onCommit(name); };
  return (
    <div className="ns-wrap" style={{flex:1,minWidth:0}}>
      <input ref={inputRef} className="f-input" value={q} placeholder={placeholder} autoFocus={autoFocus}
        onChange={e => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => {
          setOpen(false);
          if(!committedRef.current && onCancel) onCancel();
          committedRef.current = false;
        }, 150)}
        onKeyDown={e => {
          if(e.key === 'ArrowDown'){ e.preventDefault(); setOpen(true); setHi(h => Math.min(opts.length - 1, h + 1)); }
          else if(e.key === 'ArrowUp'){ e.preventDefault(); setHi(h => Math.max(0, h - 1)); }
          else if(e.key === 'Enter'){
            e.preventDefault();
            if(open && opts[hi]) commit(opts[hi].name);
            else if(q.trim()) commit(q.trim());
            else if(value && onClear){ committedRef.current = true; setOpen(false); onClear(); }
          }
          else if(e.key === 'Escape'){ e.stopPropagation(); setOpen(false); if(onCancel) onCancel(); }
        }}/>
      {open && opts.length > 0 && (
        <div className="ac-panel mv-panel" role="listbox">
          {opts.map((m, i) => (
            <button type="button" key={m.name} role="option" aria-selected={i === hi}
              className={'mvac-opt' + (i === hi ? ' hi' : '')}
              onMouseEnter={() => setHi(i)}
              onMouseDown={e => { e.preventDefault(); commit(m.name); }}>
              <span className="tbm" style={{background:TYPE_COLORS[m.type]}}>{TYPE_ABBR[m.type]}</span>
              <span className="mvac-name">{m.name}</span>
              <span className="mvac-pow">{m.cat === 'STA' ? 'STA' : (m.pow || '—')}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* Tiny popup list used for inline ability editing on cards — same overlay pattern,
   chip row height untouched. */
function ChipMenu({options, value, onPick, onClose, anchorLabel}){
  const wrap = React.useRef(null);
  useEffect(() => {
    const away = e => { if(wrap.current && !wrap.current.contains(e.target)) onClose(); };
    const key = e => { if(e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', away);
    document.addEventListener('keydown', key);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('keydown', key); };
  }, []);
  return (
    <span ref={wrap} className="chip-menu-wrap" onClick={e => e.stopPropagation()}>
      <span className="sq-chip chip-menu-anchor">{anchorLabel}</span>
      <div className="chip-menu">
        {options.map(o => (
          <button key={o.value} className={'chip-menu-opt' + (o.value === value ? ' sel' : '')}
            onClick={() => { onPick(o.value); onClose(); }}>
            <span>{o.label}</span>{o.note && <span className="chip-menu-note">{o.note}</span>}
          </button>
        ))}
      </div>
    </span>
  );
}

/* Inline item editor used on squad/reference cards — same overlay pattern as the
   inline move editor; the chip row keeps its exact height so cards never resize. */
function CardItemEditor({value, onDone}){
  const [q, setQ] = useState(value || '');
  const qRef = React.useRef(value || '');
  const doneRef = React.useRef(false);
  const wrapRef = React.useRef(null);
  const fire = v => { if(doneRef.current) return; doneRef.current = true; onDone(v); };
  useEffect(() => {
    const el = wrapRef.current && wrapRef.current.querySelector('input');
    if(el){ el.focus(); el.select(); }
  }, []);
  return (
    <span ref={wrapRef} className="sq-item-edit" onClick={e => e.stopPropagation()}
      onKeyDown={e => { if(e.key === 'Escape'){ e.stopPropagation(); fire(null); } }}
      onBlurCapture={() => setTimeout(() => fire(qRef.current), 160)}>
      <ItemInput value={q} onChange={v => { qRef.current = v; setQ(v); }}
        onEnterNext={() => fire(qRef.current)}/>
    </span>
  );
}

function ItemInput({value, onChange, readOnly, style, onEnterNext}){
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const opts = useMemo(() => {
    const n = (value || '').trim().toLowerCase();
    const l = n ? ITEMS_MB.filter(x => x.toLowerCase().includes(n)) : ITEMS_MB;
    return l.slice(0, 60);
  }, [value]);
  useEffect(() => setHi(0), [value]);
  if(readOnly) return <input className="f-input" value={value} readOnly style={style}/>;
  const commit = v => { onChange(v); setOpen(false); };
  return (
    <div className="ns-wrap">
      <input className="f-input" value={value} placeholder="e.g. Focus Sash"
        onChange={e => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        onKeyDown={e => {
          if(e.key === 'ArrowDown'){ e.preventDefault(); setOpen(true); setHi(h => Math.min(opts.length - 1, h + 1)); }
          else if(e.key === 'ArrowUp'){ e.preventDefault(); setHi(h => Math.max(0, h - 1)); }
          else if(e.key === 'Enter'){
            e.preventDefault();
            if(open && opts[hi]) commit(opts[hi]);
            else setOpen(false);
            if(onEnterNext) onEnterNext();
          }
          else if(e.key === 'Escape'){ e.stopPropagation(); setOpen(false); }
        }}/>
      {open && opts.length > 0 && (
        <div className="ac-panel mv-panel" role="listbox">
          {opts.map((it, i) => (
            <button type="button" key={it} role="option" aria-selected={i === hi}
              className={'mvac-opt' + (i === hi ? ' hi' : '')}
              onMouseEnter={() => setHi(i)}
              onMouseDown={e => { e.preventDefault(); commit(it); if(onEnterNext) onEnterNext(); }}>
              <span className="mvac-name">{it}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function NumStep({value, min, max, onChange, ariaLabel, small}){
  const clamp = v => Math.max(min, Math.min(max, v));
  return (
    <span className={'numstep' + (small ? ' small' : '')}>
      <input className={small ? 'mini-num' : 'sp-num'} type="number" min={min} max={max} value={value}
        onChange={e => onChange(clamp(parseInt(e.target.value) || 0))} aria-label={ariaLabel}/>
      <span className="numstep-btns">
        <button type="button" tabIndex={-1} onClick={() => onChange(clamp(value + 1))} aria-label="Increase">▲</button>
        <button type="button" tabIndex={-1} onClick={() => onChange(clamp(value - 1))} aria-label="Decrease">▼</button>
      </span>
    </span>
  );
}

function ShotModal({shot, onClose}){
  const [copied, setCopied] = useState(false);
  const [copyErr, setCopyErr] = useState(false);
  const doCopy = async () => {
    try{
      await navigator.clipboard.write([new window.ClipboardItem({'image/png': shot.blob})]);
      setCopied(true); setCopyErr(false);
      setTimeout(() => setCopied(false), 1600);
    }catch(_){ setCopyErr(true); }
  };
  const doDownload = () => {
    const a = document.createElement('a');
    a.href = shot.url; a.download = 'pokepanion_output.png';
    document.body.appendChild(a); a.click(); a.remove();
  };
  return (
    <div className="overlay" onClick={e => { if(e.target === e.currentTarget) onClose(); }}>
      <div className="shot-box" role="dialog" aria-modal="true" aria-label="Team sheet preview">
        <button className="close-x" onClick={onClose} aria-label="Close">✕</button>
        <h2 className="about-title">Team sheet</h2>
        <img className="shot-img" src={shot.url} alt="Squad team sheet preview"/>
        <div className="shot-actions">
          <button className="btn primary" onClick={doCopy}>{copied ? 'Copied ✓' : 'Copy image'}</button>
          <button className="btn" onClick={doDownload}>Download PNG</button>
        </div>
        {copyErr && <div className="cbd-note" style={{textAlign:'center'}}>This browser wouldn't allow copying — use Download instead.</div>}
      </div>
    </div>
  );
}

function SPEditor({dexMon, sp, setSp, nature}){
  const total = STAT_KEYS.reduce((a, k) => a + (sp[k] || 0), 0);
  const setOne = (k, val) => {
    let v = Math.max(0, Math.min(SP_CAP, parseInt(val) || 0));
    const others = total - (sp[k] || 0);
    if(others + v > SP_TOTAL) v = SP_TOTAL - others;
    setSp(s => { const n = {...s}; if(v > 0) n[k] = v; else delete n[k]; return n; });
  };
  const nm = NATURE_MODS[nature] || {};
  return (
    <div className="sp-editor">
      <div className="sp-total">
        <div className="sp-total-track"><div className="sp-total-bar" style={{width:`${total / SP_TOTAL * 100}%`}}/></div>
        <span className="sp-total-num"><b style={{color:'var(--gold)'}}>{total}</b>/{SP_TOTAL}</span>
      </div>
      {STAT_KEYS.map((k, i) => (
        <div className="sp-row" key={k}>
          <span className="sp-name" style={nm.up === k ? {color:'#E5766B'} : nm.down === k ? {color:'#5AA7F0'} : null}>
            {k}{nm.up === k ? '▲' : nm.down === k ? '▼' : ''}
          </span>
          <span className="sp-base">{dexMon.stats[i]}</span>
          <input type="range" min={0} max={SP_CAP} value={sp[k] || 0} onChange={e => setOne(k, e.target.value)} aria-label={k + ' stat points'}/>
          <NumStep value={sp[k] || 0} min={0} max={SP_CAP} onChange={v => setOne(k, v)} ariaLabel={k + ' stat points'}/>
        </div>
      ))}
      <div className="form-chips" style={{marginTop:10}}>
        {SP_PRESETS.map(p => (
          <button type="button" key={p.n} className="fchip" onClick={() => setSp({...p.sp})}>{p.n}</button>
        ))}
      </div>
    </div>
  );
}

function BuilderModal({initial, slot, onSave, onClose, onCycle}){
  const [q, setQ] = useState(initial ? initial.species : '');
  const [dexMon, setDexMon] = useState(initial ? findMon(initial.species) : null);
  const [item, setItem] = useState(initial ? initial.item : '');
  const [ability, setAbility] = useState(initial ? initial.ability : '');
  const [nature, setNature] = useState(initial ? initial.nature : '');
  const [moves, setMoves] = useState(initial ? [...initial.moves, '', '', '', ''].slice(0,4) : ['','','','']);
  const [shiny, setShiny] = useState(initial ? !!initial.shiny : false);
  const [dragIdx, setDragIdx] = useState(null);
  const [focusIdx, setFocusIdx] = useState(null);
  const [sp, setSp] = useState(initial ? {...toSP(initial.evs)} : {});
  const [acIdx, setAcIdx] = useState(0);
  const [acOpen, setAcOpen] = useState(false);
  useEffect(() => {
    const h = e => { if(e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  const suggestions = useMemo(() => {
    if(!q || (dexMon && dexMon.name === q)) return [];
    const n = norm(q);
    return compPool().filter(p => p.slug.includes(n) || norm(p.name).includes(n)).slice(0, 8);
  }, [q, dexMon]);
  useEffect(() => setAcIdx(0), [q]);
  const pick = p => {
    setDexMon(p); setQ(p.name); setAcOpen(false);
    if(MEGA_STONES[p.slug]) setItem(MEGA_STONES[p.slug]);
    else if(item && Object.values(MEGA_STONES).includes(item)) setItem('');
    const abils = [...p.abilities, ...(p.hiddenAbility ? [p.hiddenAbility] : [])];
    if(!abils.includes(ability)) setAbility(abils.length === 1 ? abils[0] : '');
    setMoves(ms => ms.map(mv => mv && LEARN[p.id] && LEARN[p.id].some(i => MOVES[i].name === mv) ? mv : (mv ? '' : mv)));
  };
  const abils = dexMon ? [...dexMon.abilities, ...(dexMon.hiddenAbility ? [dexMon.hiddenAbility] : [])] : [];
  const learnable = dexMon && LEARN[dexMon.id] ? LEARN[dexMon.id].map(i => MOVES[i].name) : [];
  const finals = dexMon ? finalStats(dexMon, {evs: sp, nature}) : null;
  const mults = dexMon ? typeMults(dexMon.types, ABILITY_MODS[ability] || null) : null;
  const typeRows = [TYPES.slice(0,9), TYPES.slice(9)];
  const buildCurrent = () => dexMon
    ? {species: dexMon.name, nickname:'', gender:'', item, ability, nature,
       level:'50', shiny, teraType:'', evs: {...sp}, ivs:{},
       moves: moves.map(m => m.trim()).filter(Boolean)}
    : null;
  const save = () => {
    const mon = buildCurrent();
    if(mon) onSave(mon);
  };
  /* Tab / Shift+Tab anywhere in the editor: save this mon and open the next /
     previous teammate on the same side */
  const bldIsMega = dexMon ? /-mega(-[a-z])?$/.test(dexMon.slug) : false;
  const bldBase = dexMon ? (bldIsMega ? (POKEDEX.find(x => x.slug === dexMon.slug.replace(/-mega(-[a-z])?$/, '')) || dexMon) : dexMon) : null;
  const bldMegas = bldBase ? POKEDEX.filter(x => x.slug === bldBase.slug + '-mega' || x.slug.startsWith(bldBase.slug + '-mega-')) : [];
  const bldCycleMega = () => {
    const cycle = [bldBase, ...bldMegas];
    const cur = cycle.findIndex(f => f.id === dexMon.id);
    const next = cycle[(cur + 1) % cycle.length];
    if(next.id !== dexMon.id) setQ(next.name);
  };
  const handleTab = e => {
    if(e.key !== 'Tab' || !onCycle) return;
    e.preventDefault();
    e.stopPropagation();
    onCycle(buildCurrent(), e.shiftKey ? -1 : 1);
  };
  return (
    <div className="overlay" onClick={e => { if(e.target === e.currentTarget) onClose(); }}>
      <div className="builder xl" role="dialog" aria-modal="true" aria-label="Pokémon builder" onKeyDown={handleTab}>
        <div className="bx-head">
          {dexMon && <img className="bx-art" key={(shiny ? 's' : 'n') + dexMon.id}
            src={shiny ? ART_SHINY(dexMon.id) : ART(dexMon.id)} alt=""
            onError={e => { if(shiny && !e.target.dataset.sf){ e.target.dataset.sf = '1'; e.target.src = ART(dexMon.id); } else spriteFallback(e, dexMon); }}/>}
          <div>
            <h3 style={{marginBottom:2}}>{dexMon ? dexMon.name : (initial ? 'Edit Pokémon' : 'Add Pokémon')}</h3>
            {dexMon && <div className="row-dexno">#{String(dexMon.dex).padStart(4,'0')}{slot ? ` · Slot ${slot}` : ''}</div>}
            {dexMon && <div className="type-badges" style={{marginTop:4}}>
              {dexMon.types.map(t => <span key={t} className="tb" style={{background:TYPE_COLORS[t]}}>{t}</span>)}
            </div>}
          </div>
          <div className="bld-icons">
            <button className="close-x" onClick={onClose} aria-label="Close">✕</button>
            {dexMon && <Tip text="Toggle shiny artwork">
              <button type="button" className={'bld-ico' + (shiny ? ' gold' : '')} onClick={() => setShiny(s => !s)} aria-label="Shiny"><ShinyIcon/></button>
            </Tip>}
            {dexMon && bldMegas.length > 0 && <Tip text={bldIsMega ? 'Showing ' + dexMon.name + ' — click to cycle back' : (bldMegas.length > 1 ? 'Mega Evolve (cycles forms)' : 'Mega Evolve')}>
              <button type="button" className={'bld-ico' + (bldIsMega ? ' gold' : '')} onClick={bldCycleMega} aria-label="Mega form"><MegaIcon/></button>
            </Tip>}
          </div>
        </div>
        <div className={dexMon ? 'bx-cols' : null}>
          <div>
            <div className="f-label">Species · {REG.id} pool</div>
            <div className="ns-wrap">
              <input className="f-input" value={q} autoFocus
                onChange={e => { setQ(e.target.value); setDexMon(null); setAcOpen(true); }}
                onFocus={() => setAcOpen(true)}
                onKeyDown={e => {
                  if(!acOpen || !suggestions.length){
                    if(e.key === 'ArrowDown' && suggestions.length) setAcOpen(true);
                    return;
                  }
                  if(e.key === 'ArrowDown'){ e.preventDefault(); setAcIdx(i => Math.min(suggestions.length - 1, i + 1)); }
                  else if(e.key === 'ArrowUp'){ e.preventDefault(); setAcIdx(i => Math.max(0, i - 1)); }
                  else if(e.key === 'Enter'){ e.preventDefault(); pick(suggestions[acIdx]); }
                  else if(e.key === 'Escape'){ e.stopPropagation(); setAcOpen(false); }
                }}
                placeholder="Start typing a name…" role="combobox" aria-expanded={acOpen && suggestions.length > 0}/>
              {acOpen && suggestions.length > 0 && (
                <div className="ac-panel" role="listbox">
                  {suggestions.map((p,i) => (
                    <button type="button" key={p.id} role="option" aria-selected={i === acIdx}
                      className={'ac-opt' + (i === acIdx ? ' hi' : '')}
                      onMouseEnter={() => setAcIdx(i)} onClick={() => pick(p)}>
                      <img className="ac-sprite" src={ART(p.id)} alt="" onError={e => spriteFallback(e, p)}/>
                      <span>{p.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            {!dexMon && <div className="ac-hint">↑ ↓ to browse · Enter to select</div>}
            {dexMon && (
              <React.Fragment>
                <div className="f-label">Ability</div>
                <Tip text={ABIL_DESC[ability]} className="block-tip">
                  <select className="f-select" value={ability} onChange={e => setAbility(e.target.value)}>
                    <option value="">—</option>
                    {abils.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                </Tip>
                <div className="f-label">Held item{MEGA_STONES[dexMon.slug] ? ' · Mega Stone required' : ''}</div>
                <Tip text={ITEM_DESC[item]} className="block-tip">
                  <ItemInput value={item} onChange={setItem} onEnterNext={() => { setFocusIdx(null); setTimeout(() => setFocusIdx(0), 0); }}
                    readOnly={!!MEGA_STONES[dexMon.slug]}
                    style={MEGA_STONES[dexMon.slug] ? {color:'var(--gold)',cursor:'default'} : null}/>
                </Tip>
                                <div className="f-label">Moves · {learnable.length} learnable</div>
                {moves.map((mv,i) => {
                  const md = MOVE_BY_NAME[mv];
                  return (
                    <div className={'bx-move' + (dragIdx === i ? ' dragging' : '')} key={i}
                      draggable onDragStart={() => setDragIdx(i)}
                      onDragOver={e => e.preventDefault()}
                      onDrop={() => { if(dragIdx !== null && dragIdx !== i) setMoves(ms => { const n = [...ms]; [n[dragIdx], n[i]] = [n[i], n[dragIdx]]; return n; }); setDragIdx(null); }}
                      onDragEnd={() => setDragIdx(null)}>
                      <span className="bx-grip" aria-hidden="true">⋮⋮</span>
                      <MoveInput value={mv} learnIds={LEARN[dexMon.id] || []} placeholder="Search a move…"
                        autoFocus={focusIdx === i}

                        onCancel={() => setFocusIdx(null)}/>

                {typeRows.map((row,ri) => (
                  <div className="eff-grid" key={ri}>
